name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Display Node and npm versions
      run: |
        node -v
        npm -v

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    # ISS-010 / Phase 5.1: build must fail the job (no continue-on-error).
    - name: Build
      run: npm run build

    - name: Debug build failures
      if: failure()
      run: |
        echo "Build/typecheck failed on Node.js version ${{ matrix.node-version }}"
        echo "Environment:"
        npm list typescript
        node -p "process.versions"

    # ISS-010 / Phase 5.1: test must fail the job (no continue-on-error).
    - name: Test
      run: npm test

    - name: Pack smoke
      run: npm run pack:smoke

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: coverage/
      if: success() || failure()

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: npm-logs-${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          npm-debug.log*
          yarn-debug.log*
          yarn-error.log*
          lerna-debug.log*
          .npm
